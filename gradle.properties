# IntelliJ Platform the overlay compiles and runs tests against.
#
# Ideally this would match the pinned kotlin-lsp release in dist.properties, but no
# test-framework is published at 262.8190 (the published line jumps 261.26222.x -> 262.8665.x),
# so an exact match is impossible. 2026.2 is the closest self-consistent platform.
overlay.platformVersion=2026.2

org.gradle.jvmargs=-Xmx4g
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
