# Pinned kotlin-lsp release the compile-check and overlay build resolve against.
#
# Newer builds exist on the CDN than are announced in the upstream RELEASES.md or cut as GitHub
# releases -- 263.2689.0 is published and shipped inside VS Code extension 0.0.8, while the
# newest GitHub release is 262.9593.0 / extension 0.0.6. Guessing build numbers finds nothing;
# `scripts/fetch-dist.sh --check` reads the real build out of the Marketplace extension instead.
#
# 263.2689.0 is the first build that advertises codeLensProvider and ships LSCodeLensProvider,
# which is what un-gates overlay/features/code-vision.
kotlinLspVersion=263.2689.0
