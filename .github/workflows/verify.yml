name: verify

# Reusable engine: run all three verification layers (unit tests, compile-check, end-to-end
# smoke test) against a given kotlin-lsp checkout. See "Testing" in README.md for what each
# layer proves. Called by ci.yml (this repo's own CI) and test-fork.yml (any fork/branch/PR).
on:
  workflow_call:
    inputs:
      kotlin-lsp-repo:
        description: owner/name of the kotlin-lsp repository to test
        type: string
        default: Kotlin/kotlin-lsp
      kotlin-lsp-ref:
        description: branch, tag, or SHA to test
        type: string
        default: main
      compile-check-hard:
        description: fail the job on compile errors outside the known-skew baseline
        type: boolean
        default: true

jobs:
  gradle-test:
    name: gradle test (${{ inputs.kotlin-lsp-repo }}@${{ inputs.kotlin-lsp-ref }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      # No kotlin-lsp checkout: the Gradle build compiles the feature cores against a plain
      # IntelliJ platform, never against the upstream sources.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: gradle test
        run: ./gradlew test --stacktrace --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  compile-check:
    name: compile-check (${{ inputs.kotlin-lsp-repo }}@${{ inputs.kotlin-lsp-ref }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      # Stands in for the `upstream` submodule, so an arbitrary fork/ref can be tested.
      - name: Checkout kotlin-lsp into upstream/
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kotlin-lsp-repo }}
          ref: ${{ inputs.kotlin-lsp-ref }}
          path: upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 for kotlinc (upstream targets JVM 25); 21 kept available too.
          java-version: |
            21
            25

      - name: Cache release distribution + kotlinc
        uses: actions/cache@v4
        with:
          path: |
            build/dist
            build/kotlinc
          key: dist-${{ hashFiles('dist.properties', 'scripts/fetch-kotlinc.sh') }}

      - name: compile-check
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          if [ "${{ inputs.compile-check-hard }}" = "true" ]; then
            ./scripts/compile-check.sh
          else
            ./scripts/compile-check.sh || echo "::warning::compile-check reported errors outside the baseline (soft mode for fork testing — see log)"
          fi

  smoke-test:
    name: smoke test (build → install → LSP queries)
    runs-on: ubuntu-latest
    # The end-to-end check: build the overlay jar against the pinned release, apply it to a
    # server copy exactly as a user would, then drive that server over stdio and assert it
    # answers the feature requests. Ref-independent — it tests the shipped release, not a
    # source checkout — so it runs identically for ci.yml and test-fork.yml.
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache release distribution + kotlinc
        uses: actions/cache@v4
        with:
          path: |
            build/dist
            build/kotlinc
          key: dist-${{ hashFiles('dist.properties', 'scripts/fetch-kotlinc.sh') }}

      - name: Build the overlay jar
        run: ./scripts/build-server.sh --jar-only

      - name: Apply the overlay to a server copy
        run: |
          version="$(grep -E '^kotlinLspVersion=' dist.properties | cut -d= -f2)"
          cp -r "build/dist/kotlin-server-$version" build/smoke-server
          ./scripts/install-overlay.sh build/smoke-server

      - name: Run combined LSP queries against the patched server
        run: ./scripts/smoke-test.py build/smoke-server

      - name: Run each feature in an isolated server
        run: ./scripts/smoke-test.py build/smoke-server --each

      # The VS Code extension dials a TCP port rather than speaking stdio, so the transport the
      # composition server is actually used over needs its own end-to-end run.
      - name: Run the suite over the TCP transport
        run: ./scripts/smoke-test.py build/smoke-server --socket

      # Two pure modules with no editor dependency: the JUnit parser that decides what the
      # Testing panel shows, and the index gate the rename guard waits on. Both are fast, so there
      # is no reason for either to be unverified.
      - name: VS Code client unit tests
        run: |
          cd editors/vscode
          npm install --no-audit --no-fund
          npm test

      # The VS Code client calls server commands and reads fields out of their results. Nothing
      # else checks those assumptions, and when one is wrong the client does not fail loudly --
      # it quietly does nothing, which reads as a server bug from the editor.
      - name: Check the VS Code client's server contract
        run: ./scripts/check-client-contract.py build/smoke-server

      # Negative control. build/dist/kotlin-server-<v> is the pristine download -- the copy above
      # was made before install-overlay.sh touched anything. Every FEATURE check must FAIL there:
      # one that passes is asserting something the stock server already does, and would keep
      # passing if the feature were deleted. This caught a code action that duplicated a shipped
      # built-in.
      #
      # Checks under regressions/ are exempt and must PASS here instead -- they watch behaviour the
      # stock server provides (rename across files), so this run is where they mean the most.
      - name: Require every feature check to fail against an unmodified server
        run: |
          version="$(grep -E '^kotlinLspVersion=' dist.properties | cut -d= -f2)"
          ./scripts/smoke-test.py "build/dist/kotlin-server-$version" --stock
