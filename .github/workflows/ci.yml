name: ci

# The overlay's own CI: unit tests, compile-check against current upstream kotlin-lsp, and the
# end-to-end smoke test (build the overlay → install it → drive the server over stdio).
# test-fork.yml runs the same jobs against any other fork/branch/PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # defaults: Kotlin/kotlin-lsp@main, compile-check hard.
